name: Deploy Stremio Addons Library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog JSON
        run: |
          node -e "const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('data/catalog.json','utf8')); if (!Array.isArray(x) && !Array.isArray(x.addons)) throw new Error('catalog.json must contain addons array');"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare static site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/catalog.json _site/data/catalog.json
          cp -R addons _site/addons
          test -s _site/addons/account-exporter/manifest.json
          test -s _site/addons/account-exporter/configure/index.html
          test -s _site/addons/account-exporter/catalog/movie/account-exporter.json
          test -s _site/addons/account-exporter/meta/movie/stremio-account-exporter.json

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
