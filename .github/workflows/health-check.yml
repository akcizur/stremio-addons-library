name: Check Stremio Addons

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'data/catalog.json'
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/health-check.yml'

permissions:
  contents: read

jobs:
  verify-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run sanitizer tests
        run: npm test

      - name: Verify addon manifests
        run: node tools/health-check.js data/catalog.json
